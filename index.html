<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2c3e50">
<title>Auto Salary Planner</title>
<style>
    :root {
        --primary: #3498db;
        --success: #2ecc71;
        --danger: #e74c3c;
        --dark: #2c3e50;
        --gray: #95a5a6;
        --light: #ecf0f1;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8f9fa; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { margin: 0; color: var(--dark); font-size: 1.5em; }
    .header p { margin: 5px 0 0 0; color: var(--gray); font-size: 0.85em; }

    .card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    /* Dynamic Daily Board */
    .daily-board { text-align: center; color: #fff; transition: background 0.3s; position: relative; overflow: hidden;}
    .daily-board.positive { background: linear-gradient(135deg, #27ae60, #2ecc71); }
    .daily-board.negative { background: linear-gradient(135deg, #c0392b, #e74c3c); }
    .daily-amount { font-size: 3.5em; font-weight: 800; margin: 10px 0; letter-spacing: -1px; }
    .daily-label { font-size: 0.9em; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }
    .rollover-badge { background: rgba(255,255,255,0.2); display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; margin-top: 10px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-box { background: var(--light); padding: 12px; border-radius: 12px; }
    .stat-box label { display: block; font-size: 0.75em; color: var(--gray); text-transform: uppercase; margin-bottom: 4px;}
    .stat-box .val { font-size: 1.2em; font-weight: bold; color: var(--dark); }

    /* Quick Add Buttons */
    .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .quick-btn { 
        background: #fff; border: 1px solid #e0e0e0; padding: 12px 5px; border-radius: 12px; 
        text-align: center; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .quick-btn:active { transform: scale(0.95); background: var(--light); }
    .quick-btn span { display: block; font-size: 1.2em; margin-bottom: 4px; }
    .quick-btn small { font-size: 0.75em; color: var(--gray); font-weight: bold; }

    input, select, button.primary-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 1em; margin-bottom: 12px; }
    input, select { background: var(--light); border: 1px solid transparent; outline: none; }
    input:focus { border-color: var(--primary); background: #fff; }
    button.primary-btn { background: var(--primary); color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3); }
    
    .hidden { display: none !important; }
    
    .history-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 0.9em; }
    .history-item:last-child { border: none; }
    .h-name { font-weight: bold; color: var(--dark); }
    .h-time { font-size: 0.8em; color: var(--gray); }
    .h-amt { font-weight: bold; color: var(--danger); }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Auto Planner</h1>
        <p>Smart rollovers. Zero maintenance.</p>
    </div>

    <!-- 1-Time Setup -->
    <div id="setup-view" class="card hidden">
        <h3 style="margin-top:0;">One-Time Setup</h3>
        <p style="font-size:0.85em; color:var(--gray);">Set it once. It runs automatically every month.</p>
        
        <label style="font-size:0.8em; color:var(--gray); font-weight:bold;">Monthly Salary (₹)</label>
        <input type="number" id="s-salary" placeholder="50000">
        
        <label style="font-size:0.8em; color:var(--gray); font-weight:bold;">Payday (Date 1-31)</label>
        <input type="number" id="s-date" placeholder="1">
        
        <label style="font-size:0.8em; color:var(--gray); font-weight:bold;">Savings + Fixed Bills (₹)</label>
        <input type="number" id="s-fixed" placeholder="20000 (Rent + EMI + Savings)">
        
        <label style="font-size:0.8em; color:var(--gray); font-weight:bold;">Base Daily Allowance (₹)</label>
        <input type="number" id="s-daily" placeholder="150 (For tea, snacks, transit)">
        
        <button class="primary-btn" onclick="saveSetup()">Initialize System</button>
    </div>

    <!-- Main App -->
    <div id="app-view" class="hidden">
        
        <!-- The Dynamic Daily Board -->
        <div class="card daily-board positive" id="board">
            <div class="daily-label" id="board-label">Available to Spend Today</div>
            <div class="daily-amount" id="display-daily">₹0</div>
            <div class="rollover-badge" id="display-rollover">Includes ₹0 saved from yesterday</div>
        </div>

        <!-- Quick 1-Tap Actions -->
        <div class="quick-actions">
            <div class="quick-btn" onclick="quickAdd('Tea/Coffee', 20)">
                <span>☕</span><small>₹20</small>
            </div>
            <div class="quick-btn" onclick="quickAdd('Snacks', 50)">
                <span>🥪</span><small>₹50</small>
            </div>
            <div class="quick-btn" onclick="quickAdd('Transit', 30)">
                <span>🛺</span><small>₹30</small>
            </div>
        </div>

        <div class="card">
            <div class="grid-2">
                <div class="stat-box">
                    <label>Big Purchase Fund</label>
                    <div class="val" style="color: #9b59b6;" id="display-fund">₹0</div>
                </div>
                <div class="stat-box">
                    <label>Days to Payday</label>
                    <div class="val" id="display-days">0</div>
                </div>
            </div>
            
            <button class="primary-btn" style="margin-top:15px; background: #2c3e50;" onclick="document.getElementById('custom-expense').classList.toggle('hidden')">
                + Add Custom Expense
            </button>
            
            <div id="custom-expense" class="hidden" style="margin-top: 15px; padding-top:15px; border-top:1px solid #eee;">
                <input type="text" id="c-name" placeholder="What did you buy?">
                <input type="number" id="c-amt" placeholder="Amount (₹)">
                <select id="c-type">
                    <option value="daily">Deduct from Daily Allowance</option>
                    <option value="big">Deduct from Big Purchase Fund</option>
                </select>
                <button class="primary-btn" onclick="addCustom()">Save</button>
            </div>
        </div>

        <div class="card">
            <h4 style="margin:0 0 10px 0; color:var(--gray);">Today's Activity</h4>
            <div id="history-list"></div>
            <div style="text-align:center; margin-top:15px;">
                <button onclick="factoryReset()" style="background:none; border:none; color:var(--danger); font-size:0.8em; text-decoration:underline;">Factory Reset</button>
            </div>
        </div>

    </div>
</div>

<script>
    const STORAGE_KEY = 'auto_planner_v3';
    let data = {
        salary: 0,
        payday: 1,
        fixed: 0,
        baseDaily: 0,
        rolloverPool: 0, // Money saved from previous days
        lastUpdatedDate: null, 
        currentCycleMonth: null,
        expenses: []
    };

    function init() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored) {
            data = JSON.parse(stored);
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            processTimePassage(); // The magic function
            updateUI();
        } else {
            document.getElementById('setup-view').classList.remove('hidden');
            document.getElementById('app-view').classList.add('hidden');
        }
    }

    function saveSetup() {
        data.salary = parseFloat(document.getElementById('s-salary').value);
        data.payday = parseInt(document.getElementById('s-date').value);
        data.fixed = parseFloat(document.getElementById('s-fixed').value);
        data.baseDaily = parseFloat(document.getElementById('s-daily').value);
        
        if(!data.salary || !data.payday || isNaN(data.fixed) || isNaN(data.baseDaily)) {
            alert("Fill all fields"); return;
        }

        // Initialize time tracking
        const todayStr = new Date().toDateString();
        data.lastUpdatedDate = todayStr;
        data.currentCycleMonth = getCycleMonth();
        data.rolloverPool = 0;
        data.expenses = [];

        saveData();
        init();
    }

    // --- THE AUTOMATION ENGINE ---
    // This runs every time the app opens to check what happened while it was closed.
    function processTimePassage() {
        const today = new Date();
        const todayStr = today.toDateString();
        
        if (data.lastUpdatedDate === todayStr) return; // Already updated today

        // 1. Check for Payday Reset (Did a new month start?)
        const activeCycleMonth = getCycleMonth();
        if (activeCycleMonth !== data.currentCycleMonth) {
            // HAPPY PAYDAY! Reset everything automatically.
            data.currentCycleMonth = activeCycleMonth;
            data.rolloverPool = 0; // Reset rollover, start fresh
            data.expenses = [];
            data.lastUpdatedDate = todayStr;
            saveData();
            alert("Happy Payday! Your budgets have been automatically reset for the new month.");
            return;
        }

        // 2. Process Rollovers for missed days
        const lastDate = new Date(data.lastUpdatedDate);
        // Calculate days between last open and today (ignoring time of day)
        const diffTime = Math.abs(today - lastDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        if (diffDays > 0) {
            // For every day that passed, calculate what was left of the allowance and add it to the pool
            for(let i = 0; i < diffDays; i++) {
                // Determine expenses for that specific past day
                let checkDate = new Date(lastDate);
                checkDate.setDate(lastDate.getDate() + i);
                
                let spentOnDay = data.expenses
                    .filter(e => new Date(e.timestamp).toDateString() === checkDate.toDateString() && e.type === 'daily')
                    .reduce((sum, e) => sum + e.amount, 0);
                
                let leftover = data.baseDaily - spentOnDay;
                data.rolloverPool += leftover; 
            }
            data.lastUpdatedDate = todayStr;
            saveData();
        }
    }

    function getCycleMonth() {
        const d = new Date();
        if (d.getDate() >= data.payday) return d.getMonth(); // Current month
        return d.getMonth() === 0 ? 11 : d.getMonth() - 1; // Previous month
    }

    function getDaysToPayday() {
        const today = new Date();
        let nextPayday = new Date(today.getFullYear(), today.getMonth(), data.payday);
        
        // If today is past the payday, next payday is next month
        if (today.getDate() >= data.payday) {
            nextPayday.setMonth(nextPayday.getMonth() + 1);
        }
        
        const diffTime = Math.abs(nextPayday - today);
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    function updateUI() {
        const todayStr = new Date().toDateString();
        
        // Calculate Today's Available Allowance
        const spentToday = data.expenses
            .filter(e => new Date(e.timestamp).toDateString() === todayStr && e.type === 'daily')
            .reduce((sum, e) => sum + e.amount, 0);
        
        const availableToday = data.baseDaily + data.rolloverPool - spentToday;

        // Calculate Big Purchase Fund
        // Fund = Salary - Fixed - (Total Days in Cycle * baseDaily)
        const daysInCycle = 30; // Approximation for simplicity in frontend
        const totalDailyBudget = daysInCycle * data.baseDaily;
        const spentOnBig = data.expenses
            .filter(e => e.type === 'big')
            .reduce((sum, e) => sum + e.amount, 0);
        
        const fund = data.salary - data.fixed - totalDailyBudget - spentOnBig;

        // Update Board
        const board = document.getElementById('board');
        const dAmt = document.getElementById('display-daily');
        const dLabel = document.getElementById('board-label');
        const rBadge = document.getElementById('display-rollover');

        dAmt.innerText = '₹' + Math.abs(availableToday);
        
        if (availableToday < 0) {
            board.className = 'card daily-board negative';
            dLabel.innerText = "Over Budget By";
            rBadge.innerText = "Tomorrow's allowance will be reduced.";
        } else {
            board.className = 'card daily-board positive';
            dLabel.innerText = "Available to Spend Today";
            if (data.rolloverPool > 0) {
                rBadge.innerText = `Includes ₹${data.rolloverPool} saved up`;
                rBadge.style.display = 'inline-block';
            } else {
                rBadge.style.display = 'none';
            }
        }

        document.getElementById('display-fund').innerText = '₹' + fund;
        document.getElementById('display-days').innerText = getDaysToPayday();

        // Render History
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        const todaysExpenses = data.expenses
            .filter(e => new Date(e.timestamp).toDateString() === todayStr)
            .sort((a, b) => b.timestamp - a.timestamp);
            
        if(todaysExpenses.length === 0) {
            list.innerHTML = '<p style="color:var(--gray); text-align:center; font-size:0.9em;">No expenses yet today.</p>';
        } else {
            todaysExpenses.forEach(e => {
                const time = new Date(e.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                list.innerHTML += `
                    <div class="history-item">
                        <div>
                            <div class="h-name">${e.name}</div>
                            <div class="h-time">${time} • ${e.type==='daily' ? 'Daily' : 'Big Fund'}</div>
                        </div>
                        <div class="h-amt">-₹${e.amount}</div>
                    </div>
                `;
            });
        }
    }

    function quickAdd(name, amount) {
        addRecord(name, amount, 'daily');
    }

    function addCustom() {
        const name = document.getElementById('c-name').value;
        const amt = parseFloat(document.getElementById('c-amt').value);
        const type = document.getElementById('c-type').value;
        if(name && amt > 0) {
            addRecord(name, amt, type);
            document.getElementById('c-name').value = '';
            document.getElementById('c-amt').value = '';
            document.getElementById('custom-expense').classList.add('hidden');
        }
    }

    function addRecord(name, amount, type) {
        data.expenses.push({
            id: Date.now(),
            name, amount, type,
            timestamp: new Date().getTime()
        });
        saveData();
        updateUI();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function factoryReset() {
        if(confirm("Wipe everything and start over?")) {
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        }
    }

    init();
</script>
</body>
</html>
