<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Personal Expense Tracker PWA" />

    <title>ExpensePilot</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />

    <!-- Icons -->
    <link rel="icon" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #f8fafc;
            font-family: Inter, system-ui, sans-serif;
        }

        .glass {
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.8);
        }

        .card {
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
    </style>
</head>

<body>

    <!-- App Container -->
    <div id="app" class="min-h-screen">

        <!-- Header -->
        <header class="bg-blue-600 text-white px-5 py-5 shadow-md">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold">
                        ExpensePilot
                    </h1>
                    <p class="text-sm opacity-90">
                        Smart Salary Budget Tracker
                    </p>
                </div>

                <button
                    id="addExpenseBtn"
                    class="bg-white text-blue-600 px-4 py-2 rounded-xl font-semibold">
                    + Expense
                </button>
            </div>
        </header>

        <!-- Dashboard -->
        <main class="p-4 space-y-4">

            <!-- Summary -->
            <section class="grid grid-cols-2 gap-4">

                <div class="card p-4">
                    <p class="text-gray-500 text-sm">
                        Salary
                    </p>

                    <h2 class="text-2xl font-bold">
                        ₹50,000
                    </h2>
                </div>

                <div class="card p-4">
                    <p class="text-gray-500 text-sm">
                        Balance
                    </p>

                    <h2 class="text-2xl font-bold text-green-600">
                        ₹31,500
                    </h2>
                </div>

            </section>

            <!-- Daily Budget -->
            <section class="card p-5">

                <div class="flex justify-between items-center">
                    <div>
                        <h3 class="font-semibold text-lg">
                            Today's Safe Budget
                        </h3>

                        <p class="text-gray-500 text-sm">
                            Based on remaining days
                        </p>
                    </div>

                    <div class="text-right">
                        <p class="text-3xl font-bold text-blue-600">
                            ₹850
                        </p>
                    </div>
                </div>

            </section>

            <!-- Safe To Spend -->
            <section class="card p-5">

                <h3 class="font-semibold text-lg mb-3">
                    Safe To Spend
                </h3>

                <div class="flex gap-2">
                    <input
                        type="number"
                        placeholder="Enter amount"
                        class="flex-1 border rounded-xl p-3 outline-none">

                    <button
                        class="bg-blue-600 text-white px-5 rounded-xl">
                        Check
                    </button>
                </div>

            </section>

            <!-- Expense List -->
            <section class="card p-5">

                <div class="flex justify-between mb-4">
                    <h3 class="font-semibold text-lg">
                        Recent Expenses
                    </h3>

                    <span class="text-blue-600">
                        View All
                    </span>
                </div>

                <div class="space-y-3">

                    <div class="flex justify-between">
                        <span>Lunch</span>
                        <span>₹120</span>
                    </div>

                    <div class="flex justify-between">
                        <span>Fuel</span>
                        <span>₹500</span>
                    </div>

                    <div class="flex justify-between">
                        <span>Coffee</span>
                        <span>₹60</span>
                    </div>

                </div>

            </section>

            <!-- Savings Goal -->
            <section class="card p-5">

                <div class="flex justify-between">
                    <div>
                        <h3 class="font-semibold">
                            Savings Goal
                        </h3>

                        <p class="text-gray-500">
                            Emergency Fund
                        </p>
                    </div>

                    <div class="text-right">
                        <p class="font-bold">
                            ₹25,000 / ₹50,000
                        </p>
                    </div>
                </div>

                <div class="mt-4 w-full bg-gray-200 rounded-full h-3">
                    <div
                        class="bg-green-500 h-3 rounded-full"
                        style="width:50%">
                    </div>
                </div>

            </section>

        </main>

    </div>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js");
            });
        }
    </script>

</body>
</html>
